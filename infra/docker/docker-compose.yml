services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wizflow
      POSTGRES_PASSWORD: wizflow
      POSTGRES_DB: wizflow_dev
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wizflow -d wizflow_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://wizflow:wizflow@postgres:5432/wizflow_dev
      REDIS_URL: redis://redis:6379/0
      FILE_STORAGE_PATH: /app/uploads/dev
    volumes:
      - ../../apps/api:/app
      - ../../uploads:/app/uploads
      - ../../config:/config:ro
      - ../../tests:/tests:ro
    ports:
      - "${API_HOST_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY: http://api:8000
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
    ports:
      - "${WEB_HOST_PORT:-5200}:5200"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_HOST_PORT:-8090}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
