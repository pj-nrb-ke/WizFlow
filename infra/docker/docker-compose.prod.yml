# Production on VPS — localhost binds only (Caddy handles HTTPS).
# Usage: docker compose -p wizflow -f docker-compose.prod.yml --env-file .env.prod up -d
# Always use project name `wizflow` so WizCRM containers in /opt/wizcrm are not touched.

services:
  postgres:
    image: postgres:16-alpine
    container_name: wizflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wizflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wizflow_prod
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - wizflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wizflow -d wizflow_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wizflow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: wizflow-api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql://wizflow:${POSTGRES_PASSWORD}@postgres:5432/wizflow_prod
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../../uploads:/app/uploads
      - ../../config:/config:ro
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  wizflow_postgres_data:
